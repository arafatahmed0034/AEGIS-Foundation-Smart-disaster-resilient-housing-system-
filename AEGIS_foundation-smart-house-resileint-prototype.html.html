<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Base Isolation - Laminated LRB Bearings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#060a12;
    --surface:#0d1420;
    --surface-2:#131c2c;
    --surface-3:#1a2540;
    --line:#3a465c;
    --line-bright:#3a4d70;
    --ink:#e9f0fb;
    --ink-dim:#8fa0bd;
    --ink-faint:#57648a;
    --teal:#4ad9c6;
    --teal-dim:#2a5a56;
    --amber:#f0a840;
    --red:#f2495c;
    --green:#38dc93;
    --water:#3aa6e0;
    --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-body:'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'Consolas', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-body);
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    position:relative;
    width:100%;
    height:100vh;
    background:
      radial-gradient(ellipse 1200px 700px at 50% 8%, #101c30 0%, transparent 60%),
      linear-gradient(180deg, #070c16 0%, #060a12 55%, #050810 100%);
  }

  header{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    padding:16px 22px;
    background:linear-gradient(180deg, rgba(6,10,18,.88) 0%, rgba(6,10,18,.55) 65%, transparent 100%);
    pointer-events:none;
    z-index:20;
  }
  header .brand, header .hud{ pointer-events:auto; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--teal);
  }
  .brand h1{
    margin:0;
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(20px,3vw,30px);
    letter-spacing:.01em;
    line-height:1;
    text-wrap:balance;
  }
  .brand .sub{
    font-size:12px;
    color:var(--ink-dim);
  }

  .hud{
    display:flex;
    gap:0;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    overflow-x:auto;
    max-width:62vw;
  }
  .hud-cell{
    padding:6px 12px;
    border-right:1px solid var(--line);
    min-width:76px;
    flex:0 0 auto;
  }
  .hud-cell:last-child{ border-right:none; }
  .hud-cell .k{
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    display:block;
    white-space:nowrap;
  }
  .hud-cell .v{
    font-family:var(--font-mono);
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    display:block;
    margin-top:1px;
    white-space:nowrap;
  }
  .hud-cell.lock-eng .v{ color:var(--teal); }
  .hud-cell.lock-rel .v{ color:var(--red); }
  .hud-cell.mode-normal .v{ color:var(--teal); }
  .hud-cell.mode-flood .v{ color:var(--water); }
  .hud-cell.mode-quake .v{ color:var(--red); }

  @media (max-width:1080px){
    .hud{ display:none; }
  }

  main{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:1fr;
  }

  #stageWrap{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    cursor:grab;
    touch-action:none;
  }
  #stageWrap.dragging{ cursor:grabbing; }
  #stageWrap::after{
    content:'';
    position:absolute; inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse 70% 65% at 50% 42%, transparent 55%, rgba(3,5,10,.5) 100%);
    z-index:3;
  }

  #stage{
    position:absolute;
    inset:0;
    perspective:1500px;
    perspective-origin:50% 42%;
  }

  #world{
    position:absolute;
    left:50%;
    top:60%;
    width:0; height:0;
    transform-style:preserve-3d;
    will-change:transform;
  }

  .obj3d{ position:absolute; left:50%; top:50%; transform-style:preserve-3d; }
  .face{ position:absolute; left:50%; top:50%; backface-visibility:hidden; }
  .face.cap{ }

  #groundPlane{
    background:
      repeating-linear-gradient(0deg, rgba(74,217,198,.08) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(74,217,198,.08) 0 1px, transparent 1px 40px),
      radial-gradient(ellipse at center, #101a2c 0%, #0a1220 70%, #070b14 100%);
    border-radius:50%;
    box-shadow:0 0 120px 40px rgba(0,0,0,.5) inset;
  }
  
  @keyframes waterFlow {
    0% { background-position: 0px 0px; }
    100% { background-position: 52px 52px; }
  }
  
  #waterPlane{
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, rgba(58,166,224,.8), rgba(47,122,182,.85));
    border-radius:10px;
    pointer-events:none;
    box-shadow: 0 0 50px rgba(58,166,224, 0.5);
    animation: waterFlow 3s linear infinite;
  }

  .mag-lock .face {
    transition: background 0.4s ease, filter 0.4s ease, box-shadow 0.4s ease;
  }
  .bearing-group.locked .mag-lock .face {
    background: #4ad9c6 !important;
    filter: brightness(1.3);
  }
  .bearing-group.unlocked .mag-lock .face {
    background: #3a465c !important;
    filter: brightness(0.6);
  }

  .hotspot{
    width:9px; height:9px;
    margin-left:-4.5px; margin-top:-4.5px;
    border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 3px rgba(74,217,198,.22), 0 0 10px 2px rgba(74,217,198,.7);
    opacity:0;
    transition:opacity .25s ease;
    animation:pulseDot 2.2s ease-in-out infinite;
  }
  .hotspot.show{ opacity:1; }
  @keyframes pulseDot{
    0%,100%{ box-shadow:0 0 0 3px rgba(74,217,198,.22), 0 0 8px 1px rgba(74,217,198,.6); }
    50%{ box-shadow:0 0 0 6px rgba(74,217,198,.1), 0 0 14px 4px rgba(74,217,198,.9); }
  }

  .orbit-hint{
    position:absolute;
    left:22px; bottom:18px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:.04em;
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:none;
    z-index:5;
  }
  .orbit-hint svg{ width:14px; height:14px; opacity:.7; }

  #legend{
    position:absolute;
    top:112px; right:16px;
    width:258px;
    max-height:calc(100% - 128px);
    background:rgba(13,20,32,.86);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:12px;
    z-index:15;
    display:flex;
    flex-direction:column;
    transition:transform .25s ease, opacity .25s ease;
    overflow:hidden;
  }
  #legend.collapsed{ transform:translateX(calc(100% + 16px)); opacity:0; pointer-events:none; }
  #legend .lg-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px 10px;
    border-bottom:1px solid var(--line);
  }
  #legend .lg-head h2{
    margin:0;
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
  }
  #legend .lg-head button{
    background:none; border:none; color:var(--ink-faint);
    font-size:16px; line-height:1; cursor:pointer; padding:2px 4px;
  }
  #legend .lg-head button:hover{ color:var(--ink); }
  #legendList{
    list-style:none; margin:0; padding:8px;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:2px;
  }
  #legendList li{
    display:flex; gap:9px; align-items:flex-start;
    padding:7px 8px;
    border-radius:7px;
    cursor:default;
    transition:background .15s ease;
  }
  #legendList li:hover, #legendList li.active{ background:var(--surface-3); }
  .swatch{
    width:11px; height:11px; border-radius:3px;
    margin-top:3px; flex:0 0 auto;
    box-shadow:0 0 6px rgba(0,0,0,.4);
  }
  .lg-num{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--ink-faint);
    flex:0 0 auto;
    width:14px;
    margin-top:2px;
  }
  .lg-text b{ display:block; font-size:12.5px; font-weight:600; color:var(--ink); }
  .lg-text span{ display:block; font-size:11px; color:var(--ink-dim); line-height:1.4; margin-top:1px; }

  .legend-toggle-tab{
    position:absolute; top:112px; right:16px;
    z-index:16;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.06em;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    display:none;
  }
  .legend-toggle-tab.show{ display:block; }
  .legend-toggle-tab:hover{ color:var(--ink); border-color:var(--line-bright); }

  #dock{
    position:absolute;
    left:50%; bottom:20px;
    transform:translateX(-50%);
    z-index:15;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(13,20,32,.88);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:14px;
    padding:9px;
    max-width:calc(100vw - 32px);
    flex-wrap:wrap;
    justify-content:center;
  }

  .seg{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:9px;
    padding:3px;
    gap:3px;
  }
  .seg button{
    font-family:var(--font-body);
    font-weight:600;
    font-size:12.5px;
    color:var(--ink-dim);
    background:transparent;
    border:none;
    border-radius:6px;
    padding:8px 13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .seg button svg{ width:13px; height:13px; opacity:.85; }
  .seg button:hover{ color:var(--ink); }
  .seg button.active{ background:var(--surface-3); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line-bright); }
  .seg button[data-mode="normal"].active{ color:var(--teal); }
  .seg button[data-mode="flood"].active{ color:var(--water); }
  .seg button[data-mode="earthquake"].active{ color:var(--red); }

  .dock-divider{ width:1px; height:26px; background:var(--line); }

  #quakeBtn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.02em;
    color:#2a0a0e;
    background:linear-gradient(180deg, #ff6a76, var(--red));
    border:none;
    border-radius:9px;
    padding:10px 16px;
    cursor:pointer;
    display:flex; align-items:center; gap:7px;
    box-shadow:0 0 0 1px rgba(242,73,92,.35), 0 4px 14px -4px rgba(242,73,92,.65);
    transition:transform .12s ease, box-shadow .12s ease;
    white-space:nowrap;
  }
  #quakeBtn svg{ width:14px; height:14px; }
  #quakeBtn:hover{ transform:translateY(-1px); box-shadow:0 0 0 1px rgba(242,73,92,.5), 0 6px 18px -4px rgba(242,73,92,.8); }
  #quakeBtn:active{ transform:translateY(0); }

  .icon-btn{
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--ink-dim);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    flex:0 0 auto;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:hover{ color:var(--ink); border-color:var(--line-bright); }
  .icon-btn.on{ color:var(--teal); border-color:var(--teal-dim); background:rgba(74,217,198,.08); }

  @media (max-width:640px){
    #legend{ display:none; }
    .legend-toggle-tab{ display:none !important; }
    .seg button span.lbl{ display:none; }
    .seg button{ padding:9px; }
  }

  @media (prefers-reduced-motion: reduce){
    * { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="eyebrow">Interactive Structural Model</span>
      <h1>Adaptive Base Isolation System</h1>
      <span class="sub">Drag to orbit &middot; Realistic Laminated Rubber Bearings &middot; 40mm Limit</span>
    </div>
    <div class="hud" id="hud">
      <div class="hud-cell mode-normal" id="hudMode"><span class="k">Mode</span><span class="v">Normal</span></div>
      <div class="hud-cell lock-eng" id="hudLock"><span class="k">Mag Lock</span><span class="v">Engaged</span></div>
      <div class="hud-cell" id="hudLift"><span class="k">Lift Height</span><span class="v">0.00 m</span></div>
      <div class="hud-cell" id="hudGround"><span class="k">Base Shake</span><span class="v">0 mm</span></div>
      <div class="hud-cell" id="hudIso"><span class="k">Bearing Shear</span><span class="v">0 mm</span></div>
      <div class="hud-cell" id="hudSway"><span class="k">House Sway</span><span class="v">0 mm</span></div>
      <div class="hud-cell" id="hudMag"><span class="k">Magnitude</span><span class="v">&mdash;</span></div>
    </div>
  </header>

  <main>
    <div id="stageWrap">
      <div id="stage">
        <div id="world"></div>
      </div>
      <div class="orbit-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v8h8"/></svg>
        drag to orbit &middot; scroll to zoom &middot; flick to spin
      </div>
    </div>

    <div id="legend">
      <div class="lg-head">
        <h2>System Components</h2>
        <button id="legendClose" aria-label="Collapse legend">&times;</button>
      </div>
      <ul id="legendList"></ul>
    </div>
    <button class="legend-toggle-tab" id="legendOpen">COMPONENTS</button>

    <div id="dock">
      <div class="seg" id="modeSeg">
        <button data-mode="normal" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 21v-4h6v4"/></svg>
          <span class="lbl">Normal</span>
        </button>
        <button data-mode="flood">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 16c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><path d="M3 20c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><path d="M12 3v9m0 0-3.5-3.5M12 12l3.5-3.5"/></svg>
          <span class="lbl">Flood Lift</span>
        </button>
        <button data-mode="earthquake">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 14l3-4 3 6 3-9 3 7 3-6 3 4h2"/></svg>
          <span class="lbl">Earthquake</span>
        </button>
      </div>

      <div class="dock-divider"></div>

      <button id="quakeBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-14h-8l1-6z"/></svg>
        Trigger Quake Jolt
      </button>

      <div class="dock-divider"></div>

      <button class="icon-btn" id="autoRotBtn" title="Auto-rotate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn on" id="hotspotBtn" title="Toggle component markers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
      <button class="icon-btn" id="resetBtn" title="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3.2-6.9M3 4v5h5"/></svg>
      </button>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var world = document.getElementById('world');

  function make(tag, cls){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    return e;
  }
  function obj3d(cls){ return make('div', 'obj3d ' + (cls||'')); }

  function place(e, o){
    o = o || {};
    var x=o.x||0, y=o.y||0, z=o.z||0, rx=o.rx||0, ry=o.ry||0, rz=o.rz||0, skx=o.skx||0;
    var sx=o.sx!=null?o.sx:(o.s!=null?o.s:1);
    var sy=o.sy!=null?o.sy:(o.s!=null?o.s:1);
    var sz=o.sz!=null?o.sz:(o.s!=null?o.s:1);
    e.style.transform = 'translate3d('+x.toFixed(2)+'px,'+y.toFixed(2)+'px,'+z.toFixed(2)+'px) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) rotateZ('+rz.toFixed(2)+'deg) skewX('+skx.toFixed(2)+'deg) scale3d('+sx.toFixed(3)+','+sy.toFixed(3)+','+sz.toFixed(3)+')';
  }

  function ease(cur, target, halfLifeMs, dt){
    var k = 1 - Math.pow(0.5, dt/halfLifeMs);
    return cur + (target-cur)*k;
  }

  function makeBox(w,h,d,color,opts){
    opts = opts || {};
    var box = obj3d('box');
    var faces = [
      {w:w,h:h, t:'translateZ('+(d/2)+'px)',                     b:1.0},
      {w:w,h:h, t:'rotateY(180deg) translateZ('+(d/2)+'px)',     b:0.5},
      {w:d,h:h, t:'rotateY(90deg) translateZ('+(w/2)+'px)',      b:0.78},
      {w:d,h:h, t:'rotateY(-90deg) translateZ('+(w/2)+'px)',     b:0.62},
      {w:w,h:d, t:'rotateX(90deg) translateZ('+(h/2)+'px)',      b:1.28},
      {w:w,h:d, t:'rotateX(-90deg) translateZ('+(h/2)+'px)',     b:0.32}
    ];
    faces.forEach(function(f){
      var face = make('div','face');
      face.style.width = f.w+'px';
      face.style.height = f.h+'px';
      face.style.marginLeft = (-f.w/2)+'px';
      face.style.marginTop = (-f.h/2)+'px';
      face.style.background = color;
      face.style.filter = 'brightness(' + f.b + ')';
      face.style.transform = f.t;
      if(opts.glow){ face.style.boxShadow = 'inset 0 0 15px ' + color; }
      box.appendChild(face);
    });
    return box;
  }

  function makeCylinder(radius,height,sides,color,opts){
    opts = opts || {};
    var cyl = obj3d('cyl');
    var faceW = 2*radius*Math.sin(Math.PI/sides);
    var apo = radius*Math.cos(Math.PI/sides);
    for(var i=0;i<sides;i++){
      var angle = i*360/sides;
      var light = 0.5 + 0.6*Math.max(0, Math.cos((angle-35)*Math.PI/180));
      var face = make('div','face');
      face.style.width = faceW.toFixed(2)+'px';
      face.style.height = height+'px';
      face.style.marginLeft = (-faceW/2).toFixed(2)+'px';
      face.style.marginTop = (-height/2)+'px';
      face.style.background = color;
      face.style.filter = 'brightness('+light.toFixed(2)+')';
      face.style.transform = 'rotateY('+angle.toFixed(2)+'deg) translateZ('+apo.toFixed(2)+'px)';
      cyl.appendChild(face);
    }
    var capR = radius/Math.cos(Math.PI/sides);
    var topCap = make('div','face cap');
    topCap.style.width = topCap.style.height = (2*capR).toFixed(2)+'px';
    topCap.style.marginLeft = topCap.style.marginTop = (-capR).toFixed(2)+'px';
    topCap.style.borderRadius = '50%';
    topCap.style.background = opts.capColor || color;
    topCap.style.filter = 'brightness(1.35)';
    topCap.style.transform = 'rotateX(90deg) translateZ('+(height/2)+'px)';
    cyl.appendChild(topCap);
    var botCap = topCap.cloneNode();
    botCap.style.filter = 'brightness(0.38)';
    botCap.style.transform = 'rotateX(-90deg) translateZ('+(height/2)+'px)';
    cyl.appendChild(botCap);
    cyl.dataset.h = height;
    return cyl;
  }

  function hotspot(parent, x,y,z){
    var h = make('div','obj3d hotspot');
    place(h,{x:x,y:y,z:z});
    parent.appendChild(h);
    return h;
  }

  var GLASS = 'repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 24px), repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 2px, transparent 2px 20px), linear-gradient(155deg, #3c5176, #26374f)';

  /* ============ main render loop ============ */
  function tick(t){
    var dt = lastT===null ? 16.7 : Math.min(t-lastT, 48);
    lastT = t;
    var dtS = dt/1000;
    var dtSteps = dt/16.7;

    if(dragging){
      /* rotY / rotX live */
    } else if(autoRotate){
      rotY += autoSpeed*dtSteps;
    } else if(rotYVel !== 0){
      rotY += rotYVel*dtSteps;
      rotYVel *= Math.pow(0.9, dtSteps);
      if(Math.abs(rotYVel) < 0.002) rotYVel = 0;
    }

    zoom = ease(zoom, zoomTarget, 120, dt);
    world.style.transform = 'rotateX('+rotX.toFixed(2)+'deg) rotateY('+rotY.toFixed(2)+'deg) scale('+zoom.toFixed(3)+')';

    /* -------- Proportional Lift -------- */
    if (isFlood) {
      if (waterY < 15) {
        lift = (15 - waterY) * 1.05; 
        if (lift > LIFT_MAX) lift = LIFT_MAX;
      }
    } else {
      lift = ease(lift, 0, 800, dt);
    }
    
    var min_lift = 10; 
    var current_scissor_h = lift + min_lift;
    var h_tier = current_scissor_h / SCISSOR_TIERS;
    var theta = Math.asin(Math.min(1, h_tier / SCISSOR_L)); 
    var thetaDeg = theta * 180 / Math.PI;

    RISER_BASE_Y = -current_scissor_h;
    place(riser, {y: RISER_BASE_Y, x: 0});

    /* -------- Water & Dynamic Lift Sensor Tracking -------- */
    waterY = ease(waterY, waterYTarget, 2000, dt);
    waterOp = ease(waterOp, waterOpTarget, 1000, dt);

    for (var i=0; i<liftSensors.length; i++) {
        var tier = liftSensors[i].tier;
        var centerY = -(tier * h_tier) - (h_tier / 2);
        var worldY = 20 + centerY; 

        if (waterY < worldY + 12) { 
            liftSensors[i].led.style.background = '#3aa6e0';
            liftSensors[i].led.style.boxShadow = '0 0 16px 6px rgba(58,166,224, 1)';
        } else {
            liftSensors[i].led.style.background = '#f2495c';
            liftSensors[i].led.style.boxShadow = '0 0 8px 2px rgba(242,73,92, 0.8)';
        }
    }

    /* -------- Shake calculation with Mathematical limits -------- */
    shakeEnv = ease(shakeEnv, shakeTarget, 300, dt);
    var ambientTarget = shakeEnv * amp * (Math.sin(t*0.0006)*18 + Math.sin(t*0.0014)*10 + Math.sin(t*0.0003)*8);
    var accel = (ambientTarget - gSpring.x)*SPRING_K - gSpring.v*SPRING_D;
    gSpring.v += accel*dtS;
    gSpring.x += gSpring.v*dtS;
    
    var rawShake = gSpring.x;
    var logicalShake = (mode === 'earthquake') ? Math.max(-40, Math.min(40, rawShake)) : 0; 

    if (Math.abs(logicalShake) > 1.5 && mode === 'earthquake') {
        mpuTriggered = true;
    } else if (mode !== 'earthquake') {
        mpuTriggered = false;
    }

    var visualShake = logicalShake * 0.45;

    place(ground, {x: visualShake, y: 40, rx: 90});
    place(contactShadow, {x: visualShake, y: 39, rx: 90, s: 1-(lift/LIFT_MAX)*0.22});
    place(foundation, {x: visualShake, y: 20});
    place(water, {x: visualShake, y: waterY, rx: 90});
    water.style.opacity = waterOp;

    for(var i=0; i<scissorArms.length; i++){
      var arm = scissorArms[i];
      var centerY = -(arm.tier * h_tier) - (h_tier / 2);
      if (arm.axis === 'z') {
        place(arm.el, {x: arm.x + visualShake, y: centerY, z: arm.z, rz: thetaDeg * arm.dir});
      } else {
        place(arm.el, {x: arm.x + visualShake, y: centerY, z: arm.z, rx: thetaDeg * arm.dir});
      }
    }

    place(baseSlab, {x: visualShake, y: -BASE_H/2});

    if (mpuTriggered) {
        mpuLed.style.background = '#f2495c'; // Red Triggered
        mpuLed.style.boxShadow = '0 0 10px 3px rgba(242,73,92,0.9)';
    } else {
        mpuLed.style.background = '#38dc93'; // Green Monitor
        mpuLed.style.boxShadow = '0 0 6px 1px rgba(56,220,147,0.7)';
    }

    /* -------- REALISTIC HIDDEN BEARING LOGIC -------- */
    unlockAmt = ease(unlockAmt, (mpuTriggered ? 1 : 0), 400, dt);
    
    // Top plate moves up slightly revealing the bearing when unlocked
    var bearingGap = BR_H * unlockAmt;
    var skewDeg = (unlockAmt > 0.01) ? -Math.atan2(visualShake, BR_H) * (180 / Math.PI) : 0;

    for(var j=0;j<bearings.length;j++){
      var br = bearings[j];
      
      // Bottom flange and collar move with shaking base
      var p_y_bot = -BASE_H - 4/2;
      var m_y = -BASE_H - 4 - 8/2;
      place(br.plateBot, {x: br.x + visualShake, y: p_y_bot, z: br.z});
      place(br.magLock, {x: br.x + visualShake, y: m_y, z: br.z});
      
      // Rubber layers stretch and appear as the gap opens
      var b_y = -BASE_H - 12 - (BR_H * unlockAmt)/2;
      place(br.bearing, {x: br.x + visualShake/2, y: b_y, z: br.z, skx: skewDeg, sy: Math.max(0.001, unlockAmt)});
      br.bearing.style.opacity = unlockAmt > 0.01 ? 1 : 0; 
      
      // Top flange is stable with the platform above
      var p_y_top = -BASE_H - 12 - (BR_H * unlockAmt) - 4/2;
      place(br.plateTop, {x: br.x, y: p_y_top, z: br.z}); 
      br.plateTop.style.opacity = unlockAmt > 0.01 ? 1 : 0; 
    }

    // Platform rests on the top flanges
    var platformBottom = -BASE_H - 12 - (BR_H * unlockAmt) - 4;
    place(platform, {x: 0, y: platformBottom - PLAT_H/2});
    
    var platformTopY = platformBottom - PLAT_H;
    place(occlusionRing, {y: platformTopY + 2, rx: 90});
    place(controlBox, {x: 112, y: platformTopY - 7, z: 96});
    place(buildingShaker, {y: platformTopY});

    /* -------- EXACT 40MM UI Updates -------- */
    hudGround.querySelector('.v').textContent = Math.round(Math.abs(logicalShake))+' mm';
    hudIso.querySelector('.v').textContent = Math.round(Math.abs(logicalShake))+' mm';
    
    hudSway.querySelector('.v').textContent = '0 mm';
    hudLift.querySelector('.v').textContent = (lift/LIFT_MAX*1.20).toFixed(2)+' m';
    
    if(mode==='earthquake'){
      var mag = 5.0 + Math.min(3.2, Math.abs(logicalShake)/12);
      hudMag.querySelector('.v').textContent = 'M ' + mag.toFixed(1);
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
